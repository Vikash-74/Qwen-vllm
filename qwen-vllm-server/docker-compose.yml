services:
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: ${SERVER_NAME:-qwen-vllm-server}
    restart: unless-stopped
    ipc: host
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://${MONITORING_HOST:-127.0.0.1}:4318/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - --model
      - ${MODEL_ID:-Qwen/Qwen2.5-0.5B-Instruct}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-qwen-0.5b}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${MAX_MODEL_LEN:-2048}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.35}
      - --dtype
      - ${DTYPE:-auto}
      - --otlp-traces-endpoint
      - http://${MONITORING_HOST:-127.0.0.1}:4318/v1/traces
      - --collect-detailed-traces
      - all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  hf-cache:
