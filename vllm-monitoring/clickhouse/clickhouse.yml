apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse-forecasts
    type: grafana-clickhouse-datasource
    access: proxy
    jsonData:
      host: clickhouse          # compose service name
      port: 9000                # native protocol, internal network only
      protocol: native
      secure: false
      username: ${CLICKHOUSE_USER}
      defaultDatabase: monitoring
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
