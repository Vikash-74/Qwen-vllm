  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [ gpu ]
  #   profiles: [ "gpu-metrics" ]

volumes:
  prometheus-data:
  grafana-data:
  clickhouse-data:
  clickhouse-logs:
